<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2020" viewBox="0 0 1200 2020" role="img" aria-labelledby="title desc">
  <title id="title">VHOX SYSTEM — GitHub profile redesign preview</title>
  <desc id="desc">An editorial dark GitHub profile design with blue outlined panels, projects, contribution shooter, live signal and contact links.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#121e31"/><stop offset=".48" stop-color="#090e16"/><stop offset="1" stop-color="#0c1b20"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0"><stop stop-color="#1d7f92" stop-opacity=".24"/><stop offset=".58" stop-color="#173f53" stop-opacity=".07"/><stop offset="1" stop-color="#0a1018" stop-opacity="0"/></radialGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#0b121c"/><stop offset=".62" stop-color="#151326"/><stop offset="1" stop-color="#244e55"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="cells" width="32" height="32" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="20" height="20" rx="3" fill="#151e29"/><rect x="4" y="4" width="20" height="20" rx="3" fill="#28513f" opacity=".45"/></pattern>
    <style>
      .p{fill:url(#panel);stroke:#3988df;stroke-opacity:.7;stroke-width:1.25}.inner{fill:#080d14;fill-opacity:.43;stroke:#438dde;stroke-opacity:.82}.ey{fill:#54a7ff;font:700 13px monospace;letter-spacing:3px}.cmd{fill:#77869c;font:13px monospace}.copy{fill:#aeb9ca;font:17px Arial,sans-serif}.muted{fill:#8d9bb0;font:12px monospace;letter-spacing:1px}.title{fill:#ebf2fd;font:700 57px Arial,sans-serif;letter-spacing:-3px}.h{fill:#e8f0fc;font:700 23px Arial,sans-serif}.value{font:700 46px Arial,sans-serif;letter-spacing:-2px}.tiny{fill:#69798e;font:11px monospace}.chip{fill:#dbe8f8;font:700 13px Arial,sans-serif}.rule{stroke:#438dde;stroke-opacity:.68}.dot{fill:#55a7ff}.corner{fill:#55a7ff;opacity:.8}
    </style>
  </defs>
  <rect width="1200" height="2480" fill="#080d14"/>
  <ellipse cx="600" cy="100" rx="550" ry="240" fill="#174d76" opacity=".11" filter="url(#soft)"/>

  <g transform="translate(70 55)">
    <rect class="p" width="1060" height="310" rx="26"/><rect x="31" y="31" width="998" height="248" rx="22" fill="url(#glow)" stroke="#438dde" stroke-opacity=".64"/>
    <circle cx="895" cy="104" r="65" fill="none" stroke="#5791c7" stroke-opacity=".1"/><circle cx="895" cy="104" r="43" fill="none" stroke="#5791c7" stroke-opacity=".1"/><circle class="dot" cx="961" cy="104" r="5"/>
    <circle cx="111" cy="139" r="61" fill="none" stroke="#55a7ff" stroke-width="2"/><circle cx="111" cy="139" r="57" fill="#142539"/><circle cx="111" cy="139" r="47" fill="none" stroke="#55a7ff" stroke-opacity=".2"/><text x="111" y="151" text-anchor="middle" fill="#dcecff" style="font:700 29px Arial,sans-serif;letter-spacing:-2px">TM</text>
    <text x="205" y="109" class="muted" style="font-weight:bold;font-size:15px">@VHOX</text><path d="M204 118 Q400 67 540 116" fill="none" stroke="#5e87bb" stroke-opacity=".45" stroke-width="2"/>
    <text x="205" y="174" class="title">Thales Maciel</text><text x="205" y="208" class="copy">Software Engineer and musician. Systems with focus, rhythm and intent.</text>
    <g transform="translate(205 231)"><rect class="inner" width="145" height="36" rx="18"/><text x="19" y="23" class="chip">OPEN SOURCE</text><rect class="inner" x="157" width="112" height="36" rx="18"/><text x="179" y="23" class="chip">SYSTEMS</text><rect class="inner" x="281" width="145" height="36" rx="18"/><text x="303" y="23" class="chip">MUSIC × CODE</text></g>
    <text x="927" y="294" class="tiny">vhox.system</text>
  </g>

  <g transform="translate(70 396)"><rect class="p" width="1060" height="236" rx="26"/><text x="34" y="48" class="ey">ABOUT</text><text x="785" y="48" class="cmd">./identity --read</text><line class="rule" x1="34" x2="1026" y1="65" y2="65"/><text x="34" y="111" class="copy">I’m Thales — a software engineer who approaches products as systems:</text><text x="34" y="139" class="copy">clear structure, dependable behavior, and an interface with intention.</text><text x="34" y="167" class="copy">Music made me a more attentive developer; engineering made me a better musician.</text><g transform="translate(747 95)"><text class="muted">ROLE</text><text x="156" class="muted" fill="#e8f0fc" style="font-weight:bold">SOFTWARE ENGINEER</text><line x1="0" x2="278" y1="18" y2="18" stroke="#8193aa" stroke-opacity=".2"/><text y="45" class="muted">MODE</text><text x="156" y="45" class="muted" fill="#e8f0fc" style="font-weight:bold">BUILD / CREATE</text><line x1="0" x2="278" y1="63" y2="63" stroke="#8193aa" stroke-opacity=".2"/></g></g>

  <g transform="translate(70 662)"><rect class="p" width="1060" height="314" rx="26"/><text x="34" y="48" class="ey">PROJECTS.LIST</text><text x="765" y="48" class="cmd">./projects --featured</text><line class="rule" x1="34" x2="1026" y1="65" y2="65"/>
    <g transform="translate(34 98)"><rect class="inner" width="295" height="179" rx="16"/><circle cx="23" cy="22" r="3" class="dot"/><text x="34" y="26" class="muted">01 / PUBLIC</text><text x="20" y="77" class="h">Vhox</text><text x="20" y="104" class="copy" style="font-size:13px">Profile repository and</text><text x="20" y="123" class="copy" style="font-size:13px">public engineering signal.</text><text x="20" y="160" class="tiny">GITHUB · 0 STARS</text></g>
  </g>

  <g transform="translate(70 1006)"><rect class="p" width="1060" height="218" rx="26"/><text x="34" y="48" class="ey">TECH.STACK</text><text x="774" y="48" class="cmd">./environment --active</text><line class="rule" x1="34" x2="1026" y1="65" y2="65"/>
    <g transform="translate(34 92)"><g><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">LANGUAGE</text><text x="14" y="57" class="chip">JavaScript</text></g><g transform="translate(125)"><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">LANGUAGE</text><text x="14" y="57" class="chip">TypeScript</text></g><g transform="translate(250)"><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">LIBRARY</text><text x="14" y="57" class="chip">React</text></g><g transform="translate(375)"><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">RUNTIME</text><text x="14" y="57" class="chip">Python</text></g><g transform="translate(500)"><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">MARKUP</text><text x="14" y="57" class="chip">HTML5</text></g><g transform="translate(625)"><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">STYLE</text><text x="14" y="57" class="chip">CSS3</text></g><g transform="translate(750)"><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">CONTROL</text><text x="14" y="57" class="chip">Git</text></g><g transform="translate(875)"><rect class="inner" width="113" height="90" rx="12"/><text x="14" y="26" class="tiny" fill="#35d6eb">LANGUAGE</text><text x="14" y="57" class="chip">C#</text></g></g>
  </g>

  <g transform="translate(70 1254)"><rect class="p" width="1060" height="273" rx="26"/><text x="34" y="48" class="ey">PROFILE.SIGNAL</text><text x="782" y="48" class="cmd">github://Vhox — public</text><line class="rule" x1="34" x2="1026" y1="65" y2="65"/>
    <g transform="translate(34 95)"><g><rect class="inner" width="229" height="142" rx="17"/><text x="20" y="31" class="muted">STARS</text><text x="20" y="79" class="value" fill="#55a7ff">0</text><rect x="20" y="109" width="188" height="7" rx="4" fill="#303947"/><rect x="20" y="109" width="32" height="7" rx="4" fill="#55a7ff"/></g><g transform="translate(247)"><rect class="inner" width="229" height="142" rx="17"/><text x="20" y="31" class="muted">CONTRIBUTIONS</text><text x="20" y="79" class="value" fill="#35d6eb" style="font-size:34px">LIVE</text><rect x="20" y="109" width="188" height="7" rx="4" fill="#303947"/><rect x="20" y="109" width="43" height="7" rx="4" fill="#35d6eb"/></g><g transform="translate(494)"><rect class="inner" width="229" height="142" rx="17"/><text x="20" y="31" class="muted">REPOS</text><text x="20" y="79" class="value" fill="#a170ed">1</text><rect x="20" y="109" width="188" height="7" rx="4" fill="#303947"/><rect x="20" y="109" width="53" height="7" rx="4" fill="#a170ed"/></g><g transform="translate(741)"><rect class="inner" width="251" height="142" rx="17"/><text x="20" y="31" class="muted">FOLLOWERS</text><text x="20" y="79" class="value" fill="#42d66a">8</text><rect x="20" y="109" width="210" height="7" rx="4" fill="#303947"/><rect x="20" y="109" width="183" height="7" rx="4" fill="#42d66a"/></g></g>
  </g>

  <g transform="translate(70 1557)"><rect class="p" width="1060" height="225" rx="26"/><text x="34" y="48" class="ey">CONNECT</text><text x="813" y="48" class="cmd">./channels --open</text><line class="rule" x1="34" x2="1026" y1="65" y2="65"/>
    <g transform="translate(34 98)"><g><rect class="inner" width="175" height="48" rx="12"/><text x="17" y="30" class="chip">01 · YOUTUBE</text></g><g transform="translate(187)"><rect class="inner" width="184" height="48" rx="12"/><text x="17" y="30" class="chip">02 · INSTAGRAM</text></g><g transform="translate(383)"><rect class="inner" width="164" height="48" rx="12"/><text x="17" y="30" class="chip">03 · TWITCH</text></g><g transform="translate(559)"><rect class="inner" width="152" height="48" rx="12"/><text x="17" y="30" class="chip">04 · EMAIL</text></g><g transform="translate(723)"><rect class="inner" width="180" height="48" rx="12"/><text x="17" y="30" class="chip">05 · LINKEDIN</text></g></g>
    <text x="34" y="184" class="tiny">INTEGRATED LINKS · NO EXTERNAL BADGES</text>
  </g>
  <text x="600" y="1860" text-anchor="middle" class="tiny" style="letter-spacing:3px">VHOX // SYSTEM · 2026</text>
</svg>
